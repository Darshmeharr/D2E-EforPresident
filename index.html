<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Darshmehar × Eemanjot</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{

    background:
    radial-gradient(circle at top,
    #1b1b1b,
    #090909 45%,
    #000000);

    color:white;

    font-family:'Playfair Display',serif;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    position:relative;
}

/* BACKGROUND GLOW */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:
    radial-gradient(circle,
    rgba(255,255,255,0.04),
    transparent 60%);

    pointer-events:none;

    z-index:0;
}

/* FALLING SYMBOLS */

.star{

    position:fixed;

    z-index:1;

    pointer-events:none;

    color:rgba(255,255,255,0.12);

    animation:fall linear infinite;
}

@keyframes fall{

    from{
        transform:translateY(-10vh) rotate(0deg);
    }

    to{
        transform:translateY(120vh) rotate(360deg);
    }
}

/* TOP TEXT */

#topText{

    position:fixed;

    top:12px;

    left:50%;

    transform:translateX(-50%);

    width:90%;

    text-align:center;

    font-family:'Great Vibes',cursive;

    font-size:22px;

    color:#d7d7d7;

    z-index:10;

    animation:float 3s ease-in-out infinite;
}

@keyframes float{

    0%{
        transform:translateX(-50%) translateY(0px);
    }

    50%{
        transform:translateX(-50%) translateY(-4px);
    }

    100%{
        transform:translateX(-50%) translateY(0px);
    }
}

/* CARD */

.container{

    width:100%;

    max-width:1000px;

    padding:55px 35px;

    border-radius:35px;

    background:
    rgba(255,255,255,0.04);

    backdrop-filter:blur(18px);

    border:
    1px solid rgba(255,255,255,0.08);

    box-shadow:
    0 0 60px rgba(255,255,255,0.05);

    position:relative;

    z-index:2;

    text-align:center;

    overflow:hidden;
}

.container::before{

    content:"";

    position:absolute;

    width:350px;
    height:350px;

    border-radius:50%;

    top:-150px;
    right:-100px;

    background:
    radial-gradient(circle,
    rgba(255,255,255,0.08),
    transparent 70%);
}

/* TITLE */

.love{

    font-family:'Great Vibes',cursive;

    font-size:76px;

    color:white;

    margin-bottom:10px;
}

.names{

    font-size:28px;

    letter-spacing:3px;

    color:#e8e8e8;

    margin-bottom:25px;
}

/* CLOCKS */

.clocks{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:25px;

    margin-bottom:25px;

    color:#d5d5d5;

    font-size:15px;
}

/* STATUS */

.status{

    font-size:18px;

    line-height:1.8;

    color:#f0f0f0;

    margin-bottom:25px;
}

/* MESSAGE */

.message{

    font-size:19px;

    line-height:2;

    color:#dadada;

    margin-bottom:25px;
}

/* FOREVER */

.forever{

    font-size:16px;

    color:#bdbdbd;

    line-height:1.9;

    margin-bottom:30px;
}

/* HEART BUTTON */

.heartBtn{

    width:100px;
    height:100px;

    border-radius:50%;

    border:none;

    cursor:pointer;

    font-size:40px;

    color:white;

    background:
    radial-gradient(circle,
    #1a1a1a,
    #070707);

    animation:pulse 2.5s infinite;

    transition:.4s;
}

.heartBtn:hover{

    transform:scale(1.08);
}

@keyframes pulse{

    0%{
        box-shadow:0 0 12px rgba(255,255,255,0.04);
    }

    50%{
        box-shadow:0 0 35px rgba(255,255,255,0.12);
    }

    100%{
        box-shadow:0 0 12px rgba(255,255,255,0.04);
    }
}

/* SONG TABS */

.songTabs{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:12px;

    margin-top:35px;
}

.songTabs button{

    padding:12px 18px;

    border:none;

    border-radius:30px;

    background:#111;

    color:white;

    cursor:pointer;

    transition:.3s;

    border:1px solid rgba(255,255,255,0.08);
}

.songTabs button:hover{

    transform:translateY(-3px);

    background:#1d1d1d;
}

/* NOW PLAYING */

.nowPlaying{

    margin-top:20px;

    color:#cfcfcf;

    font-size:15px;
}

/* PROGRESS BAR */

.progressContainer{

    width:100%;

    max-width:500px;

    height:8px;

    margin:18px auto;

    background:#1c1c1c;

    border-radius:50px;

    overflow:hidden;
}

.progress{

    width:0%;

    height:100%;

    background:white;
}

/* CONTROLS */

.controls{

    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;

    margin-top:10px;
}

.controlBtn{

    padding:12px 20px;

    border:none;

    border-radius:30px;

    background:#111;

    color:white;

    cursor:pointer;

    transition:.3s;
}

.controlBtn:hover{

    background:#1d1d1d;
}

/* SECRET TEXT */

.secret{

    margin-top:30px;

    color:#8f8f8f;

    font-size:14px;

    letter-spacing:2px;
}

/* POPUP */

.popup{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    background:rgba(0,0,0,.92);

    z-index:9999;

    padding:20px;
}

.popupContent{

    width:100%;

    max-width:650px;

    padding:40px 30px;

    border-radius:35px;

    background:
    linear-gradient(
    180deg,
    #111,
    #050505);

    border:
    1px solid rgba(255,255,255,0.08);

    text-align:center;

    line-height:2;
}

.popupContent h2{

    font-family:'Great Vibes',cursive;

    font-size:46px;

    margin-bottom:15px;
}

.closeBtn{

    margin-top:20px;

    cursor:pointer;

    color:#d5d5d5;
}

/* MOBILE */

@media(max-width:768px){

    .container{
        padding:35px 20px;
    }

    .love{
        font-size:48px;
    }

    .names{
        font-size:18px;
        letter-spacing:1px;
    }

    .message{
        font-size:15px;
    }

    .songTabs{
        flex-direction:column;
    }

    .songTabs button{
        width:100%;
    }

    .clocks{
        flex-direction:column;
        gap:10px;
    }

    .heartBtn{
        width:85px;
        height:85px;
        font-size:30px;
    }

    #topText{
        font-size:16px;
    }
}

</style>

</head>
