<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>No Contact • D to E</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    overflow:hidden;

    font-family:'Poppins',sans-serif;

    color:white;

    background:
    radial-gradient(circle at top,#151515 0%,#070707 40%,#000000 100%);

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}

/* ===== BACKGROUND ===== */

.stars{

    position:fixed;
    inset:0;
    z-index:0;
}

.star{

    position:absolute;

    width:2px;
    height:2px;

    background:white;

    border-radius:50%;

    opacity:.7;

    animation:twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{

    0%{
        opacity:.2;
        transform:scale(1);
    }

    50%{
        opacity:1;
        transform:scale(1.8);
    }

    100%{
        opacity:.2;
        transform:scale(1);
    }
}

/* ===== AURORA ===== */

.aurora{

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    filter:blur(100px);

    opacity:.18;

    animation:moveAurora 12s infinite alternate ease-in-out;
}

.aurora1{

    background:#ffffff;

    top:-150px;
    left:-100px;
}

.aurora2{

    background:#444444;

    bottom:-150px;
    right:-100px;

    animation-delay:4s;
}

@keyframes moveAurora{

    0%{
        transform:translate(0,0) scale(1);
    }

    100%{
        transform:translate(60px,-40px) scale(1.2);
    }
}

/* ===== FLOAT TEXT ===== */

#floatText{

    position:fixed;

    top:18px;

    left:50%;

    transform:translateX(-50%);

    z-index:5;

    font-family:'Great Vibes',cursive;

    font-size:22px;

    color:#eaeaea;

    letter-spacing:2px;

    animation:floating 3s infinite ease-in-out;
}

@keyframes floating{

    0%{
        transform:translateX(-50%) translateY(0);
    }

    50%{
        transform:translateX(-50%) translateY(-6px);
    }

    100%{
        transform:translateX(-50%) translateY(0);
    }
}

/* ===== MAIN CARD ===== */

.container{

    position:relative;

    z-index:2;

    width:90%;
    max-width:980px;

    padding:50px 35px;

    border-radius:35px;

    background:rgba(255,255,255,.05);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 0 40px rgba(255,255,255,.05),
    inset 0 0 30px rgba(255,255,255,.02);

    overflow:hidden;

    animation:fadeUp 1.5s ease;
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ===== GLOW BORDER ===== */

.container::before{

    content:"";

    position:absolute;

    inset:0;

    border-radius:35px;

    padding:1px;

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.15),
        transparent,
        rgba(255,255,255,.08)
    );

    -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;

    pointer-events:none;
}

/* ===== TITLE ===== */

.space-title{

    font-family:'Great Vibes',cursive;

    font-size:70px;

    text-align:center;

    margin-bottom:12px;

    color:white;

    text-shadow:
    0 0 10px rgba(255,255,255,.2);

    animation:glow 4s infinite alternate;
}

@keyframes glow{

    from{
        text-shadow:0 0 10px rgba(255,255,255,.15);
    }

    to{
        text-shadow:
        0 0 18px rgba(255,255,255,.3),
        0 0 35px rgba(255,255,255,.1);
    }
}

.names{

    text-align:center;

    font-family:'Cinzel',serif;

    font-size:34px;

    letter-spacing:4px;

    margin-bottom:28px;

    color:#f2f2f2;
}

/* ===== CLOCKS ===== */

.clocks{

    display:flex;

    justify-content:center;

    gap:22px;

    flex-wrap:wrap;

    margin-bottom:28px;
}

.clock{

    min-width:230px;

    padding:18px;

    border-radius:20px;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.08);

    text-align:center;

    transition:.4s;
}

.clock:hover{

    transform:translateY(-5px);

    background:rgba(255,255,255,.06);
}

.clock h3{

    font-size:15px;

    color:#d9d9d9;

    margin-bottom:10px;
}

.clock span{

    font-size:22px;

    font-weight:600;
}

/* ===== STATUS ===== */

.status{

    text-align:center;

    font-size:20px;

    font-weight:600;

    margin-bottom:30px;

    color:#ffffff;

    animation:pulse 2s infinite;
}

@keyframes pulse{

    0%{
        opacity:.6;
    }

    50%{
        opacity:1;
    }

    100%{
        opacity:.6;
    }
}

/* ===== QUOTE ===== */

.poem{

    text-align:center;

    font-size:18px;

    line-height:2;

    color:#d6d6d6;

    margin-bottom:25px;
}

/* ===== GURBANI ===== */

.gurbani{

    text-align:center;

    font-size:20px;

    color:#ffffff;

    font-style:italic;

    margin-bottom:35px;

    opacity:.9;
}

/* ===== HEART ===== */

.heartWrap{

    display:flex;
    justify-content:center;
}

.heart{

    width:90px;
    height:90px;

    border-radius:50%;

    background:
    radial-gradient(circle,#1f1f1f,#090909);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:42px;

    cursor:pointer;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 0 25px rgba(255,255,255,.08);

    transition:.4s;

    animation:heartbeat 2s infinite;
}

.heart:hover{

    transform:scale(1.1) rotate(5deg);

    box-shadow:
    0 0 45px rgba(255,255,255,.15);
}

@keyframes heartbeat{

    0%{
        transform:scale(1);
    }

    25%{
        transform:scale(1.05);
    }

    50%{
        transform:scale(1);
    }

    75%{
        transform:scale(1.08);
    }

    100%{
        transform:scale(1);
    }
}

/* ===== BUTTON ===== */

.music-btn{

    display:block;

    margin:30px auto 0;

    padding:14px 28px;

    border:none;

    border-radius:40px;

    background:white;

    color:black;

    font-weight:600;

    cursor:pointer;

    transition:.4s;
}

.music-btn:hover{

    transform:scale(1.05);

    letter-spacing:1px;
}

/* ===== POPUP ===== */

.popup{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.9);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:999;
}

.popupContent{

    width:90%;
    max-width:430px;

    padding:35px;

    border-radius:30px;

    background:#0d0d0d;

    text-align:center;

    border:1px solid rgba(255,255,255,.08);

    animation:fadeUp .5s ease;
}

.popupContent h2{

    margin-bottom:18px;

    font-family:'Great Vibes',cursive;

    font-size:42px;
}

.closeBtn{

    margin-top:22px;

    cursor:pointer;

    opacity:.7;
}

.closeBtn:hover{

    opacity:1;
}

/* ===== MOBILE ===== */

@media(max-width:768px){

    body{
        overflow:auto;
        padding:20px;
    }

    .container{
        padding:35px 22px;
    }

    .space-title{
        font-size:46px;
    }

    .names{
        font-size:22px;
        letter-spacing:2px;
    }

    .clock{
        width:100%;
    }

    .poem{
        font-size:15px;
    }

    .gurbani{
        font-size:16px;
    }

    .heart{
        width:75px;
        height:75px;
        font-size:35px;
    }

    #floatText{
        font-size:16px;
        width:90%;
        text-align:center;
    }
}

</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="aurora aurora1"></div>
<div class="aurora aurora2"></div>

<div id="floatText">
    Sunday • 3AM — 6AM IST 🌙
</div>

<div class="container">

    <div class="space-title">
        No Contact
    </div>

    <div class="names">
        DARSHMEHAR ✦ EEMANJOT
    </div>

    <div class="clocks">

        <div class="clock">
            <h3>🇮🇳 India</h3>
            <span id="indiaTime">--</span>
        </div>

        <div class="clock">
            <h3>🇨🇦 Canada</h3>
            <span id="canadaTime">--</span>
        </div>

    </div>

    <div class="status" id="activeStatus">
        Checking silence...
    </div>

    <div class="poem">

        Some people leave quietly,<br>
        but their memories stay loud.<br><br>

        Sundays feel different now.<br>
        Even silence has a timezone.

    </div>

    <div class="gurbani">
        "ਹੁਕਮਿ ਰਜਾਈ ਚਲਣਾ ਨਾਨਕ ਲਿਖਿਆ ਨਾਲਿ"
    </div>

    <div class="heartWrap">

        <div class="heart" onclick="openPopup()">
            🖤
        </div>

    </div>

    <button class="music-btn" onclick="toggleMusic(this)">
        ▶ Play Music
    </button>

</div>

<!-- POPUP -->

<div class="popup" id="popup">

    <div class="popupContent">

        <h2>Silent Message</h2>

        <div id="popupMsg"></div>

        <div class="closeBtn"
        onclick="closePopup()">

            Close

        </div>

    </div>

</div>

<!-- AUDIO -->

<audio id="bgMusic" loop>
    <source src="excuses.mp3" type="audio/mpeg">
</audio>

<script>

/* ===== STARS ===== */

const stars = document.getElementById("stars");

for(let i = 0; i < 120; i++){

    let star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random()*100 + "%";

    star.style.top = Math.random()*100 + "%";

    star.style.animationDelay =
    Math.random()*3 + "s";

    stars.appendChild(star);
}

/* ===== MUSIC ===== */

const bgMusic =
document.getElementById("bgMusic");

let playing = false;

function toggleMusic(btn){

    if(playing){

        bgMusic.pause();

        btn.innerText = "▶ Play Music";

    }else{

        bgMusic.volume = 0.5;

        bgMusic.play();

        btn.innerText = "⏸ Pause Music";
    }

    playing = !playing;
}

/* ===== POPUP ===== */

function openPopup(){

    document.getElementById("popup")
    .style.display = "flex";

    updatePopup();
}

function closePopup(){

    document.getElementById("popup")
    .style.display = "none";
}

function updatePopup(){

    const india = new Date(
        new Date().toLocaleString(
            "en-US",
            {timeZone:"Asia/Kolkata"}
        )
    );

    const day = india.getDay();

    const hour = india.getHours();

    const isSunday = day === 0;

    const isActive = hour >= 3 && hour < 6;

    if(isSunday && isActive){

        document.getElementById("popupMsg")
        .innerHTML =
        "🌙 Some feelings never really log out.";

    }else{

        document.getElementById("popupMsg")
        .innerHTML =
        "Currently offline.<br><br>Return Sunday between 3AM and 6AM IST 🖤";
    }
}

/* ===== CLOCKS ===== */

function updateClocks(){

    const now = new Date();

    const indiaTime =
    now.toLocaleTimeString(
        "en-IN",
        {
            timeZone:"Asia/Kolkata",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    );

    const canadaTime =
    now.toLocaleTimeString(
        "en-CA",
        {
            timeZone:"America/Vancouver",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    );

    document.getElementById("indiaTime")
    .innerText = indiaTime;

    document.getElementById("canadaTime")
    .innerText = canadaTime;

    /* STATUS */

    const india = new Date(
        now.toLocaleString(
            "en-US",
            {timeZone:"Asia/Kolkata"}
        )
    );

    const day = india.getDay();

    const hour = india.getHours();

    const isSunday = day === 0;

    const isActive = hour >= 3 && hour < 6;

    const status =
    document.getElementById("activeStatus");

    if(isSunday && isActive){

        status.innerHTML =
        "🟢 Currently Active";

    }else{

        status.innerHTML =
        "⚫ Offline Until Sunday 3AM IST";
    }
}

setInterval(updateClocks,1000);

updateClocks();

</script>

</body>
</html>
