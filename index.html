<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Premium Night Sky</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Georgia,serif;
background:linear-gradient(180deg,#020204,#07111f,#11182f);
color:#fff;overflow:hidden;min-height:100vh;
}
.sky,.nebula{position:fixed;inset:0}
.nebula{
background:
radial-gradient(circle at 20% 30%,rgba(140,82,255,.18),transparent 40%),
radial-gradient(circle at 80% 40%,rgba(0,200,255,.12),transparent 35%),
radial-gradient(circle at 50% 80%,rgba(255,100,180,.12),transparent 40%);
filter:blur(50px);
animation:move 20s ease-in-out infinite alternate;
}
@keyframes move{from{transform:scale(1)}to{transform:scale(1.1) translate(3%,3%)}}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 4s infinite}
@keyframes twinkle{50%{opacity:.3;transform:scale(1.6)}}
.moon{
position:absolute;right:80px;top:60px;width:130px;height:130px;border-radius:50%;
background:#fff;box-shadow:0 0 40px #fff,0 0 120px rgba(255,255,255,.4);
}
.container{display:flex;justify-content:center;align-items:center;height:100vh;position:relative;z-index:10;padding:20px}
.card{
max-width:900px;width:100%;
background:rgba(255,255,255,.08);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.15);
border-radius:30px;padding:40px;text-align:center;
transition:transform .2s;
}
h1{font-size:4rem;margin-bottom:10px}
.quote{margin:20px 0;color:#ddd;font-style:italic}
.clockWrap{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.clock{padding:15px 20px;border-radius:18px;background:rgba(255,255,255,.05)}
button{
padding:14px 20px;border-radius:30px;border:none;
cursor:pointer;margin-top:20px;font-size:1.2rem
}
.popup{
display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);
justify-content:center;align-items:center;z-index:100;
}
.popupBox{
background:#11182f;padding:30px;border-radius:20px;text-align:center;
max-width:500px;width:90%;
}
.firefly{
position:absolute;width:4px;height:4px;border-radius:50%;
background:#ffeb3b;box-shadow:0 0 12px #ffeb3b;
animation:fly linear infinite;
}
@keyframes fly{
0%{transform:translateY(100vh);opacity:0}
20%{opacity:1}
100%{transform:translateY(-120vh);opacity:0}
}
.shooting{
position:absolute;width:180px;height:2px;
background:linear-gradient(to right,#fff,#ffeb3b,transparent);
transform:rotate(-35deg);
animation:shoot 3s linear forwards;
}
@keyframes shoot{
from{transform:translate(-200px,-200px) rotate(-35deg)}
to{transform:translate(1600px,900px) rotate(-35deg);opacity:0}
}
</style>
</head>
<body>
<div class="sky"><div class="nebula"></div><div class="moon"></div></div>

<div class="container">
<div class="card">
<h1>Darshmehar × Eemanjot</h1>
<p class="quote" id="quote">Some people arrive unexpectedly and become impossible to forget.</p>

<div class="clockWrap">
<div class="clock" id="india"></div>
<div class="clock" id="canada"></div>
</div>

<p class="quote">Under the same sky, different horizons. Some stories begin with destiny.</p>

<button onclick="openSecret()">💫 Open Secret</button>
</div>
</div>

<div class="popup" id="popup">
<div class="popupBox">
<h2>✨ For You ✨</h2>
<p id="specialMsg"></p>
<button onclick="closeSecret()">Close</button>
</div>
</div>

<script>
const sky=document.querySelector('.sky');

for(let i=0;i<300;i++){
 let s=document.createElement('div');
 s.className='star';
 let size=Math.random()*3+1;
 s.style.width=size+'px';
 s.style.height=size+'px';
 s.style.left=Math.random()*100+'vw';
 s.style.top=Math.random()*100+'vh';
 sky.appendChild(s);
}

for(let i=0;i<30;i++){
 let f=document.createElement('div');
 f.className='firefly';
 f.style.left=Math.random()*100+'vw';
 f.style.animationDuration=(8+Math.random()*10)+'s';
 sky.appendChild(f);
}

function shootingStar(){
 let st=document.createElement('div');
 st.className='shooting';
 st.style.top=Math.random()*40+'vh';
 st.style.left='-200px';
 sky.appendChild(st);
 setTimeout(()=>st.remove(),3000);
}
setInterval(()=>{
 shootingStar();
 if(Math.random()>.6)setTimeout(shootingStar,500);
},4000);

const quotes=[
"Distance changes places, not feelings.",
"Two souls, one sky, infinite possibilities.",
"The moon knows every secret conversation.",
"In every timeline, I choose you."
];
let q=0;
setInterval(()=>{
 q=(q+1)%quotes.length;
 document.getElementById('quote').textContent=quotes[q];
},5000);

function updateClocks(){
 const now=new Date();
 india.innerHTML="🇮🇳 India<br>"+now.toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata"});
 canada.innerHTML="🇨🇦 Canada<br>"+now.toLocaleTimeString("en-CA",{timeZone:"America/Vancouver"});
}
setInterval(updateClocks,1000); updateClocks();

function openSecret(){
 popup.style.display='flex';
 const msgs=[
 "You found it 💛",
 "Distance is just a number 🌍",
 "Forever starts now 🌙",
 "Every moment matters ✨"
 ];
 specialMsg.textContent=msgs[Math.floor(Math.random()*msgs.length)];
}
function closeSecret(){popup.style.display='none';}

document.addEventListener('keydown',e=>{
 if(e.key==='Escape') closeSecret();
});

document.addEventListener('mousemove',e=>{
 const x=(e.clientX/window.innerWidth-.5)*20;
 const y=(e.clientY/window.innerHeight-.5)*20;
 document.querySelector('.moon').style.transform=`translate(${x}px,${y}px)`;
 document.querySelector('.card').style.transform=`rotateY(${x/5}deg) rotateX(${-y/5}deg)`;
});
</script>
</body>
</html>
