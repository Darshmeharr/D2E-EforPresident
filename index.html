<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darshmehar × Eemanjot ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Poppins,sans-serif;
background:linear-gradient(135deg,#070b1a,#13002d,#240046);
overflow:hidden;color:#fff;min-height:100vh}
.aurora{position:fixed;inset:0;background:
radial-gradient(circle at 20% 30%,rgba(255,0,255,.15),transparent 40%),
radial-gradient(circle at 80% 70%,rgba(0,255,255,.12),transparent 40%);
filter:blur(80px);animation:move 15s infinite alternate}
@keyframes move{from{transform:translateX(-80px)}to{transform:translateX(80px)}}
.moon{position:fixed;top:40px;right:50px;width:150px;height:150px;border-radius:50%;
background:radial-gradient(circle at 30% 30%,#fff,#f3d9ff);
box-shadow:0 0 40px #ff00ff,0 0 90px rgba(255,0,255,.5)}
.star{position:fixed;background:#fff;border-radius:50%;animation:twinkle 4s infinite}
@keyframes twinkle{50%{opacity:.3;transform:scale(1.5)}}
.container{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;position:relative;z-index:2}
.card{max-width:850px;width:100%;padding:50px;border-radius:30px;text-align:center;
background:rgba(255,255,255,.08);backdrop-filter:blur(20px)}
h1{font-family:Great Vibes,cursive;font-size:5rem}
.quote{margin:20px 0;font-size:1.2rem;min-height:60px}
.love-meter{height:16px;background:rgba(255,255,255,.1);border-radius:20px;overflow:hidden;margin:20px auto;max-width:350px}
.fill{height:100%;width:100%;background:linear-gradient(90deg,#ff4d6d,#ff00ff,#ffd700)}
.clock-wrap{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:25px 0}
.clock{padding:15px 20px;border-radius:18px;background:rgba(255,255,255,.08)}
.heart-btn{margin-top:25px;width:90px;height:90px;border:none;border-radius:50%;font-size:2rem;cursor:pointer;background:#ff00aa;color:#fff}
.popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);justify-content:center;align-items:center;z-index:10}
.popup-box{background:#1b0033;padding:40px;border-radius:25px;max-width:600px;text-align:center}
.float-heart{position:fixed;font-size:24px;pointer-events:none;animation:rise 8s linear forwards}
@keyframes rise{from{transform:translateY(100vh)}to{transform:translateY(-100px);opacity:0}}
.music{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;border:none;background:#ff00aa;color:#fff;font-size:1.4rem}
@media(max-width:768px){h1{font-size:3rem}.card{padding:25px}}
</style>
</head>
<body>
<div class="aurora"></div>
<div class="moon"></div>

<div class="container">
<div class="card">
<h1>Darshmehar × Eemanjot</h1>
<p>Two Hearts • One Universe ❤️</p>

<div class="love-meter"><div class="fill"></div></div>
<p>Connection Strength: ∞%</p>

<div id="quote" class="quote">Every star reminds me of you ❤️</div>

<div class="clock-wrap">
<div class="clock" id="india"></div>
<div class="clock" id="canada"></div>
</div>

<p>❤️ Together for <span id="days"></span> days</p>

<button class="heart-btn" onclick="openLove()">💖</button>
</div>
</div>

<div class="popup" id="popup">
<div class="popup-box">
<h2>My Favorite Person ❤️</h2>
<p id="msg"></p><br>
<button onclick="closeLove()">Close</button>
</div>
</div>

<button class="music" onclick="toggleMusic()">🎵</button>

<audio id="audio" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<script>
for(let i=0;i<180;i++){
let s=document.createElement('div');
s.className='star';
let z=Math.random()*3+1;
s.style.width=z+'px';s.style.height=z+'px';
s.style.left=Math.random()*100+'vw';
s.style.top=Math.random()*100+'vh';
document.body.appendChild(s);
}

setInterval(()=>{
let h=document.createElement('div');
h.className='float-heart';
h.innerHTML=['❤️','💖','💕','💜'][Math.floor(Math.random()*4)];
h.style.left=Math.random()*100+'vw';
document.body.appendChild(h);
setTimeout(()=>h.remove(),8000);
},700);

const quotes=[
'Every star reminds me of you ❤️',
'Distance means little when someone means everything 💜',
'In every universe, I would choose you 🌙',
'You make ordinary moments magical ✨',
'Our story shines brighter than the stars 💫'
];
let q=0;
setInterval(()=>{
q=(q+1)%quotes.length;
document.getElementById('quote').innerText=quotes[q];
},5000);

function updateClocks(){
const now=new Date();
india.innerHTML='🇮🇳 India<br>'+now.toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'});
canada.innerHTML='🇨🇦 Canada<br>'+now.toLocaleTimeString('en-CA',{timeZone:'America/Vancouver'});
}
setInterval(updateClocks,1000);updateClocks();

const startDate=new Date('2025-01-01');
days.innerText=Math.floor((new Date()-startDate)/(1000*60*60*24));

const msgs=[
'You are the calm in my chaos ❤️',
'You turned distance into something beautiful 💖',
'My favorite place is wherever you are 💜',
'The moon shines brighter when I think of you 🌙'
];

function openLove(){
popup.style.display='flex';
msg.innerText=msgs[Math.floor(Math.random()*msgs.length)];
}
function closeLove(){popup.style.display='none';}

let playing=false;
function toggleMusic(){
const a=document.getElementById('audio');
if(playing){a.pause();playing=false;}
else{a.play();playing=true;}
}
</script>
</body>
</html>
